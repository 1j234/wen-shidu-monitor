name: 温湿度监测每日推送

on:
  # 每日三个推送时间（均为北京时间，GitHub Actions用UTC，需-8小时）
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京 09:00
    - cron: '0 6 * * *'   # UTC 06:00 = 北京 14:00
    - cron: '0 10 * * *'  # UTC 10:00 = 北京 18:00
  # 支持手动触发（仓库 Actions 页面点 Run workflow）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行温湿度日报推送
        env:
          FALA_USER_ID: ${{ secrets.FALA_USER_ID }}
          FALA_USER_KEY: ${{ secrets.FALA_USER_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python daily_push.py
